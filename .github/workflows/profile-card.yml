# Regenerates the profile card, link buttons and Pac-Man board once a day.
#
# The SVGs are force-pushed as a single commit to the `output` branch, so main
# only holds hand-written changes and its history never grows from refreshes.
name: Update Profile Card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Rebuild the card and link buttons
        timeout-minutes: 15
        env:
          # PAT with repo + read:user for private repos; falls back to public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/gerar.py

      - name: Rebuild the Pac-Man board
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/pacman.py

      - name: Publish SVGs to the output branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp *.svg out/ && cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: generated profile SVGs"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
