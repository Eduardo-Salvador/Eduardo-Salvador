# Refreshes the neofetch-style profile card and the Pac-Man board once a day.
name: Update Profile Card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Rebuild the card and link buttons
        timeout-minutes: 15
        env:
          # PAT with repo + read:user for private contributions; falls back to public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/gerar.py

      - name: Rebuild the Pac-Man board
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/pacman.py

      - name: Commit the regenerated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile card stats"
            git pull --rebase origin main
            git push
          fi
